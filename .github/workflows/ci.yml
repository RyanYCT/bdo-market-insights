name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run mypy src/ tests/

  test:
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run pytest -m "not integration"

  integration:
    runs-on: ubuntu-latest
    needs: [typecheck]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bdo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bdo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run pytest -m integration

  audit:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run pip-audit

  scan:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run bandit -r src/ -c pyproject.toml

  validate:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - uses: aws-actions/setup-sam@v2
      - run: uv sync
      - run: sam validate --lint

  openapi:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      # Regenerate the OpenAPI spec from the handlers and fail on drift.
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code infra/openapi.yaml

  deploy:
    runs-on: ubuntu-latest
    needs: [test, integration, audit, scan, validate, openapi]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: uv sync
      - run: sam build
      # Deploy the COMPLETE prod state. `sam deploy --parameter-overrides`
      # replaces the whole parameter set (unspecified params revert to template
      # defaults), so every one is listed here. Domain, demo-key and hosted-zone
      # values are resolved from SSM Parameter Store at deploy (ADR-0024): the
      # overrides pass SSM *key paths*, not values, so nothing account-specific
      # is committed and a full-state deploy can't drop the custom domain. Seed
      # the keys once per stage with `make seed-config STAGE=prod`.
      #
      # MigrationsFingerprint is a content hash of migrations/versions; when it
      # changes, the auto-migrate custom resource re-runs `alembic upgrade head`
      # as lambda_migrator during the deploy and fails the deploy on a bad
      # migration (ADR-0025) -- so there is no separate migration step. Introduce
      # the custom resource to an environment two-phase (deploy AUTO_MIGRATE=false
      # + `make db-bootstrap`, then AUTO_MIGRATE=true); see ADR-0025.
      - name: Deploy (full prod state)
        run: |
          fingerprint=$(find migrations/versions -type f -name '*.py' -exec sha256sum {} \; | sort | sha256sum | cut -c1-32)
          sam deploy --config-env prod --no-confirm-changeset \
            --parameter-overrides "Stage=prod BdoRegion=tw UseRdsProxy=false EnableBastion=false AutoMigrate=true MigrationsFingerprint=$fingerprint EnableDemoKey=/bdo-market-insights/prod/api-gateway/enable-demo-key ApiDomainName=/bdo-market-insights/prod/domain/api-domain-name IconDomainName=/bdo-market-insights/prod/domain/icon-domain-name HostedZoneId=/bdo-market-insights/prod/domain/hosted-zone-id"
