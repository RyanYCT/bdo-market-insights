name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: uv run mypy src/ tests/

  test:
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: uv run pytest -m "not integration"

  integration:
    runs-on: ubuntu-latest
    needs: [typecheck]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bdo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bdo_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: uv run pytest -m integration

  audit:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: uv run pip-audit

  scan:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: uv run bandit -r src/ -c pyproject.toml

  validate:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          sam: 'true'
      - run: sam validate --lint
      # `sam validate` only inspects the root template, which carries no
      # Fn::ForEach -- so it cannot catch a nested template that the SAM
      # translator chokes on. Build here (non-tag-gated) so the language-
      # extensions expansion of etl.yaml/insights.yaml is exercised on every
      # push and PR, not only on a release tag via the deploy job.
      - run: sam build
      # Fail before deploy if any BdoRegions entry in samconfig.toml is not a
      # member of the canonical marketQuery region enum, or is a duplicate
      # (Req 5.3 / ADR-0036).
      - run: uv run python scripts/validate_regions.py

  openapi:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Regenerate the OpenAPI spec from the handlers and fail on drift.
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code infra/openapi.yaml

# NOTE: the tag-gated `deploy` job that used to live here has moved to
# .github/workflows/deploy.yml (ADR-0038). ci.yml is validation only and holds no
# `id-token: write` scope; keeping a copy here would run two deploys per tag.
