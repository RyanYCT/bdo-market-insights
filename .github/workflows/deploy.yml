name: Deploy

# The dedicated CD workflow (ADR-0038): a distinct trigger (`push: tags` /
# `workflow_dispatch`) and a distinct permission scope (`id-token: write`), so it
# does not belong in ci.yml. ci.yml stays the authoritative *validation* gate and
# no longer carries a deploy job -- this file supersedes it, so a pushed tag runs
# exactly one deploy.
#
# This workflow is the deploy EXECUTOR and the platform-enforced prod gate: the
# deploy control plane (`bdo-deploy`) only ever *triggers* it, either by pushing a
# release tag or by `gh workflow run deploy.yml -f stage=... -f version=...`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    # Typed inputs. These names are a superset of exactly what the control plane
    # sends (`stage`, and optionally `version` -- see `_input_flags` in
    # src/tools/bdo_deploy/core/executors/github.py), so the Actions UI form and
    # a wizard dispatch reach the identical job with identical inputs (Req 8.3).
    inputs:
      stage:
        description: 'Target stage (a samconfig.toml environment).'
        type: choice
        required: true
        default: dev
        options: [dev, prod]
      version:
        description: >-
          Release version vX.Y.Z, used as ApiVersion (ADR-0037). Leave empty to
          fall back to the dispatched ref name.
        type: string
        required: false
        default: ''

# A tag push is prod (`push` has no `inputs`), a dispatch deploys the stage it
# asked for. Derived once here so the job body never repeats the branch.
env:
  STAGE: ${{ github.event_name == 'push' && 'prod' || inputs.stage }}
  # ApiVersion. On a tag push `inputs.version` is empty and `github.ref_name` IS
  # the release tag, which is how the tag-gated deploy has always derived it; on
  # a dispatch the explicit `version` input wins, falling back to the dispatched
  # ref name when none was given. One expression covers both triggers.
  API_VERSION: ${{ inputs.version || github.ref_name }}

# Nothing is granted workflow-wide; the deploy job scopes what it needs.
permissions: {}

# Never let two deploys of the same stage race each other. Queued rather than
# cancelled: a half-applied CloudFormation update is worse than a wait.
concurrency:
  group: deploy-${{ github.event_name == 'push' && 'prod' || inputs.stage }}
  cancel-in-progress: false

jobs:
  # A PRE-GATE job, deliberately declaring no `environment:`. The job boundary is
  # load-bearing, not cosmetic: a job that references an Environment with required
  # reviewers waits for approval before it starts and must satisfy the
  # Environment's protection rules before running or reading its secrets, so this
  # check could not run before the approval wait as a step inside `deploy`. Here it
  # names a disallowed ref *before* the wait begins (Req 6.6 / ADR-0040 decision 4).
  # Whether a failing pre-gate also short-circuits an approval request already in
  # flight is not claimed.
  #
  # No `actions/checkout`: the body below matches two env values against each other
  # and touches nothing in the workspace, so a checkout would only add seconds. It
  # also has no `permissions` to grant -- no OIDC, no repository read.
  check-prod-ref:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Defence in depth behind the prod Environment's deployment branch/tag
      # policy (`tag:v*` + `branch:main`), which `bootstrap` configures and GitHub
      # enforces outside the repository -- THAT is the boundary (Req 6.5). This
      # job is explicitly NOT: `workflow_dispatch` runs the workflow definition
      # from the *selected* ref, so this guard is editable on the very branch being
      # dispatched. Its whole value is feedback -- naming the rejected ref in
      # seconds instead of leaving the operator at a bare "branch not allowed to
      # deploy" at the environment gate.
      #
      # Scoped to prod: "deploy this branch to dev" stays legitimate, which is the
      # point of restricting prod alone, so a dev dispatch from a feature branch
      # must not fail here. The condition sits on the STEP rather than on the job:
      # the `env` context is not available in `jobs.<job_id>.if`, and a job-level
      # condition would make this job *skip* on dev, which by default skips every
      # job that `needs:` it -- blocking the dev deploy. A job that always runs and
      # no-ops on dev keeps `deploy`'s `needs:` satisfied for both stages.
      - name: Check the deploying ref is one prod admits
        if: ${{ env.STAGE == 'prod' }}
        env:
          # The same `<type>:<pattern>` entries, in the same spelling, as
          # PROD_ALLOWED_REFS in src/tools/bdo_deploy/core/dispatch.py -- the list
          # sent to the Environment policy. A structural test asserts the two
          # lists are equal, so the two layers cannot disagree about what they
          # admit. Matched as globs below, as GitHub matches the policy patterns.
          ALLOWED_REFS: 'tag:v* branch:main'
          # One expression covers both triggers: a tag push has
          # `ref_type == 'tag'` with the tag in `ref_name`, and a dispatch reports
          # whichever ref was selected.
          REF: ${{ github.ref_type }}:${{ github.ref_name }}
        run: |
          for allowed in $ALLOWED_REFS; do
            # Unquoted on purpose: $allowed is a glob, matching `tag:v*` against
            # `tag:v1.2.3` exactly as the Environment policy pattern does.
            case "$REF" in $allowed) exit 0 ;; esac
          done
          echo "prod admits only $ALLOWED_REFS, got '$REF'" >&2
          echo "the prod Environment's deployment branch/tag policy is the real control;" >&2
          echo "release from a v* tag on main (see ADR-0040)." >&2
          exit 1

  deploy:
    runs-on: ubuntu-latest
    # The ref pre-gate runs to completion first, so a ref prod does not admit is
    # named before this job's approval wait rather than after it. On dev the
    # pre-gate's single step no-ops and the job still succeeds, so this `needs:`
    # never blocks a dev deploy.
    needs: check-prod-ref
    # The GitHub Environment IS the gate (Req 6.3): prod carries required
    # reviewers and the OIDC role ARN as an Environment secret, so the platform
    # holds the deploy before any step runs. It follows the selected stage rather
    # than being hardcoded, and every path into this job passes through it --
    # there is no unprotected route to prod.
    environment: ${{ github.event_name == 'push' && 'prod' || inputs.stage }}
    permissions:
      id-token: write # OIDC keyless deploy -- no static AWS credentials
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          sam: 'true'
      # A dispatch from the Actions UI does not pass through the wizard's
      # validation, so reject a malformed explicit version here -- before the
      # deploy -- rather than shipping it as GET /v1/meta's api_version.
      - name: Check the explicit version input
        if: ${{ inputs.version != '' }}
        run: |
          echo "$API_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "version must look like v1.2.3, got '$API_VERSION'"; exit 1; }
      # The one validation this workflow owns. ci.yml is still the authoritative
      # validation gate, but Actions cannot express a cross-workflow `needs`, so a
      # tag push starts this workflow without waiting on it. A tagged commit is on
      # main under branch protection and therefore already validated; the gap is
      # samconfig.toml's BdoRegions for THIS stage, the one input `sam build`
      # cannot check (it validates the template, not the deploy config) and the one
      # whose breakage lands as generated per-region schedules feeding an invalid
      # `region` into the pipelines (Req 5.3 / ADR-0036).
      #
      # This is a second CALL SITE of one authoritative script, not duplicated
      # logic: the rules live only in scripts/validate_regions.py, which ci.yml
      # also invokes, so the two workflows cannot drift apart -- exactly the
      # sharing ADR-0038 asks for (what it forbids is copy-pasted step logic).
      # Scoped to $STAGE (the script defaults to checking dev + prod) so a deploy
      # is never blocked by a problem in the stage it is not deploying.
      #
      # Placed before `configure-aws-credentials` and `sam build`: it needs neither,
      # and failing here costs seconds and leaves AWS untouched -- no role assumed,
      # no artifacts uploaded.
      - name: Validate BdoRegions for the target stage
        run: uv run python scripts/validate_regions.py "$STAGE"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          # Matches the `region` of every samconfig.toml stage.
          aws-region: us-east-1
      - run: sam build
      # Deploy the COMPLETE stage state. `sam deploy --parameter-overrides`
      # replaces the whole parameter set (unspecified params revert to template
      # defaults), so every one is listed here. Domain, demo-key and hosted-zone
      # values are resolved from SSM Parameter Store at deploy (ADR-0024): the
      # overrides pass SSM *key paths*, not values, so nothing account-specific
      # is committed and a full-state deploy can't drop the custom domain. Seed
      # the keys once per stage with `make seed-config STAGE=<stage>`. The paths
      # are stage-scoped, so they follow $STAGE rather than being pinned to prod.
      #
      # MigrationsFingerprint is a content hash of migrations/versions; when it
      # changes, the auto-migrate custom resource re-runs `alembic upgrade head`
      # as lambda_migrator during the deploy and fails the deploy on a bad
      # migration (ADR-0025) -- so there is no separate migration step. Introduce
      # the custom resource to an environment two-phase (deploy AUTO_MIGRATE=false
      # + `make db-bootstrap`, then AUTO_MIGRATE=true); see ADR-0025.
      - name: Deploy (full stage state)
        run: |
          fingerprint=$(find migrations/versions -type f -name '*.py' -exec sha256sum {} \; | sort | sha256sum | cut -c1-32)
          # BdoRegions is the single active-region toggle and lives only in
          # samconfig.toml (Req 1.5 / ADR-0036). A full-state --parameter-overrides
          # replaces the whole set, so the value is read back from that stage's
          # config here rather than hardcoded -- keeping one authoritative source.
          bdo_regions=$(uv run python scripts/samconfig_regions.py "$STAGE")
          # ApiVersion is the release tag on a tag run (resolved in `env` above);
          # it is the single source for GET /v1/meta's api_version (ADR-0037).
          sam deploy --config-env "$STAGE" --no-confirm-changeset \
            --parameter-overrides "Stage=$STAGE BdoRegions=$bdo_regions ApiVersion=$API_VERSION UseRdsProxy=false AutoMigrate=true MigrationsFingerprint=$fingerprint EnableDemoKey=/bdo-market-insights/$STAGE/api-gateway/enable-demo-key ApiDomainName=/bdo-market-insights/$STAGE/domain/api-domain-name IconDomainName=/bdo-market-insights/$STAGE/domain/icon-domain-name HostedZoneId=/bdo-market-insights/$STAGE/domain/hosted-zone-id"
