AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  bdo-market-insights - Serverless market-data platform for Black Desert Online.
  Hourly ETL from arsha.io into RDS Postgres with analytics API.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
  BdoRegion:
    Type: String
    Default: tw
    AllowedValues:
      - na
      - eu
      - sea
      - mena
      - kr
      - ru
      - jp
      - th
      - tw
      - sa
      - console_eu
      - console_na
      - console_asia
    Description: BDO server region passed through to ETL state machine input
  UseRdsProxy:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable RDS Proxy for Lambda connection pooling (adds ~$15/month)
  AutoMigrate:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >
      Run `alembic upgrade head` automatically on deploy via a custom resource
      (ADR-0025). Set 'false' only for a new environment's first deploy, before
      `make db-bootstrap` has created the DB roles.
  MigrationsFingerprint:
    Type: String
    Default: unset
    Description: >
      Content hash of migrations/versions, supplied by `make deploy`; a change
      is what triggers the auto-migrate custom resource to re-run (ADR-0025).
  AutoBootstrap:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >
      Start the data bootstrap (catalog -> tracked seed -> icons) once on a fresh
      environment's first create, if the items table is empty (ADR-0028).
      `make bootstrap` runs it on demand regardless.
  # These four are resolved from SSM Parameter Store at deploy (ADR-0024): the
  # value passed in is an SSM key path, CloudFormation substitutes the stored
  # value, and that value is passed down to the child stacks. Real hosts live in
  # SSM (see `make seed-config`), never in committed config; "none" is the
  # sentinel for "no custom domain". Seed the keys once per stage before deploy.
  EnableDemoKey:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /bdo-market-insights/dev/api-gateway/enable-demo-key
    Description: >
      SSM key holding "true"/"false" — publish a public read-only demo API key
      (tight usage plan; writes rejected by itemRegistry). Resolved at deploy.
  ApiDomainName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /bdo-market-insights/dev/domain/api-domain-name
    Description: >
      SSM key holding the custom API hostname, or "none" to disable (ADR-0013).
      Resolved from SSM at deploy.
  HostedZoneId:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /bdo-market-insights/dev/domain/hosted-zone-id
    Description: >
      SSM key holding the shared Route 53 hosted zone id (or "none"). Resolved
      from SSM at deploy.
  IconDomainName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /bdo-market-insights/dev/domain/icon-domain-name
    Description: >
      SSM key holding the custom icons-CDN hostname, or "none" for the default
      CloudFront domain. Resolved from SSM at deploy.
  BedrockModelId:
    Type: String
    Default: 'us.amazon.nova-lite-v1:0'
    Description: Bedrock model ID for narrative summarisation (Converse API)
  BedrockFoundationModelId:
    Type: String
    Default: 'amazon.nova-lite-v1:0'
    Description: >
      Underlying foundation-model ID that BedrockModelId routes to (IAM scoping).
      Keep in sync with BedrockModelId; strip the region prefix for CRIS profiles.
  CatalogSyncSchedule:
    Type: String
    Default: 'cron(0 8 ? * THU *)'
    Description: >
      EventBridge cron (UTC) for the weekly full-catalog sync. Default Thu 08:00
      UTC (= Thu 16:00 UTC+8), a buffer after the Thu 03:00-07:00 UTC+8 BDO
      maintenance window (which can overrun on new-item patches).
  IconSyncSchedule:
    Type: String
    Default: 'cron(0 9 ? * * *)'
    Description: >
      EventBridge cron (UTC) for the daily item-icon materializer. Default 09:00
      UTC. No-op once every tracked item's icon is stored/missing.
  LogRetentionInDays:
    Type: Number
    Default: 30
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 180
      - 365
      - 400
      - 545
      - 731
      - 1827
      - 3653
    Description: >
      Retention applied to every Lambda log group (default 30, matches the API
      SLO window). Log groups are co-located with their functions (ADR-0030).

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        STAGE: !Ref Stage
        BDO_REGION: !Ref BdoRegion
        POWERTOOLS_SERVICE_NAME: bdo-market-insights

Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: infra/network.yaml
      Parameters:
        Stage: !Ref Stage

  # Ordering after NetworkStack is enforced implicitly by the
  # !GetAtt NetworkStack.Outputs.* references below; an explicit
  # DependsOn would be redundant (cfn-lint W3005).
  DataStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: infra/data.yaml
      Parameters:
        Stage: !Ref Stage
        UseRdsProxy: !Ref UseRdsProxy
        PrivateSubnetA: !GetAtt NetworkStack.Outputs.PrivateSubnetA
        PrivateSubnetB: !GetAtt NetworkStack.Outputs.PrivateSubnetB
        PrivateSubnetAAZ: !GetAtt NetworkStack.Outputs.PrivateSubnetAAZ
        RdsSecurityGroupId: !GetAtt NetworkStack.Outputs.RdsSecurityGroupId

  EtlStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: infra/etl.yaml
      Parameters:
        Stage: !Ref Stage
        BdoRegion: !Ref BdoRegion
        LambdaSecurityGroupId: !GetAtt NetworkStack.Outputs.LambdaSecurityGroupId
        PrivateSubnetA: !GetAtt NetworkStack.Outputs.PrivateSubnetA
        DynamoDbTableName: !GetAtt DataStack.Outputs.DynamoDbTableName
        RdsEndpoint: !GetAtt DataStack.Outputs.RdsEndpoint
        RdsPort: !GetAtt DataStack.Outputs.RdsPort
        LambdaRdsAuthRoleArn: !GetAtt DataStack.Outputs.LambdaRdsAuthRoleArn
        LambdaMigratorRoleArn: !GetAtt DataStack.Outputs.LambdaMigratorRoleArn
        AutoMigrate: !Ref AutoMigrate
        MigrationsFingerprint: !Ref MigrationsFingerprint
        LogRetentionInDays: !Ref LogRetentionInDays
    # Ordering after Network/Data is enforced by the !GetAtt *.Outputs
    # references above; an explicit DependsOn would be redundant (W3005).

  InsightsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: infra/insights.yaml
      Parameters:
        Stage: !Ref Stage
        BdoRegion: !Ref BdoRegion
        CommonLayerArn: !GetAtt EtlStack.Outputs.CommonLayerArn
        LambdaSecurityGroupId: !GetAtt NetworkStack.Outputs.LambdaSecurityGroupId
        PrivateSubnetA: !GetAtt NetworkStack.Outputs.PrivateSubnetA
        RdsEndpoint: !GetAtt DataStack.Outputs.RdsEndpoint
        RdsPort: !GetAtt DataStack.Outputs.RdsPort
        LambdaRdsAuthRoleArn: !GetAtt DataStack.Outputs.LambdaRdsAuthRoleArn
        BedrockModelId: !Ref BedrockModelId
        BedrockFoundationModelId: !Ref BedrockFoundationModelId
        LogRetentionInDays: !Ref LogRetentionInDays
    # Ordering after Network/Data/Etl is enforced by the !GetAtt *.Outputs
    # references above (incl. the shared CommonLayerArn); an explicit
    # DependsOn would be redundant (cfn-lint W3005).

  ApiStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: infra/api.yaml
      Parameters:
        Stage: !Ref Stage
        BdoRegion: !Ref BdoRegion
        CommonLayerArn: !GetAtt EtlStack.Outputs.CommonLayerArn
        DynamoDbTableName: !GetAtt DataStack.Outputs.DynamoDbTableName
        LambdaSecurityGroupId: !GetAtt NetworkStack.Outputs.LambdaSecurityGroupId
        PrivateSubnetA: !GetAtt NetworkStack.Outputs.PrivateSubnetA
        RdsEndpoint: !GetAtt DataStack.Outputs.RdsEndpoint
        RdsPort: !GetAtt DataStack.Outputs.RdsPort
        LambdaRdsAuthRoleArn: !GetAtt DataStack.Outputs.LambdaRdsAuthRoleArn
        ApiDomainName: !Ref ApiDomainName
        HostedZoneId: !Ref HostedZoneId
        # CloudFront base URL from the icons stack -> itemRegistry ICON_BASE_URL,
        # so /v1/items icon_url resolves once deployed (ADR-0023).
        IconBaseUrl: !GetAtt IconsStack.Outputs.IconBaseUrl
        EnableDemoKey: !Ref EnableDemoKey
        LogRetentionInDays: !Ref LogRetentionInDays
    # Ordering after Network/Data/Etl is enforced by the !GetAtt *.Outputs
    # references above (incl. the shared CommonLayerArn); an explicit
    # DependsOn would be redundant (cfn-lint W3005).

  CatalogStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: infra/catalog.yaml
      Parameters:
        Stage: !Ref Stage
        CommonLayerArn: !GetAtt EtlStack.Outputs.CommonLayerArn
        DynamoDbTableName: !GetAtt DataStack.Outputs.DynamoDbTableName
        CatalogSyncSchedule: !Ref CatalogSyncSchedule
        LogRetentionInDays: !Ref LogRetentionInDays
    # Ordering after Data/Etl is enforced by the !GetAtt *.Outputs references
    # above (incl. the shared CommonLayerArn); an explicit DependsOn would be
    # redundant (cfn-lint W3005).

  IconsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: infra/icons.yaml
      Parameters:
        Stage: !Ref Stage
        BdoRegion: !Ref BdoRegion
        CommonLayerArn: !GetAtt EtlStack.Outputs.CommonLayerArn
        DynamoDbTableName: !GetAtt DataStack.Outputs.DynamoDbTableName
        IconSyncSchedule: !Ref IconSyncSchedule
        IconDomainName: !Ref IconDomainName
        HostedZoneId: !Ref HostedZoneId
        LogRetentionInDays: !Ref LogRetentionInDays

  BootstrapStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: infra/bootstrap.yaml
      Parameters:
        Stage: !Ref Stage
        CommonLayerArn: !GetAtt EtlStack.Outputs.CommonLayerArn
        DynamoDbTableName: !GetAtt DataStack.Outputs.DynamoDbTableName
        CatalogSyncFunctionArn: !GetAtt CatalogStack.Outputs.CatalogSyncFunctionArn
        IconSyncFunctionArn: !GetAtt IconsStack.Outputs.IconSyncFunctionArn
        AutoBootstrap: !Ref AutoBootstrap
        LogRetentionInDays: !Ref LogRetentionInDays
    # Ordering after Etl/Data/Catalog/Icons is enforced by the !GetAtt *.Outputs
    # references above; an explicit DependsOn would be redundant (cfn-lint W3005).

  ObservabilityStack:
    Type: AWS::CloudFormation::Stack
    # EtlStack ordering is enforced by the !GetAtt below. ApiStack is not
    # referenced by output (alarms/log groups target it by name), so its
    # ordering is kept explicit via DependsOn (cfn-lint W3005-safe).
    DependsOn: ApiStack
    Properties:
      TemplateURL: infra/observability.yaml
      Parameters:
        Stage: !Ref Stage
        EtlStateMachineArn: !GetAtt EtlStack.Outputs.EtlStateMachineArn
        InsightsStateMachineArn: !GetAtt InsightsStack.Outputs.InsightsStateMachineArn
        BootstrapStateMachineArn: !GetAtt BootstrapStack.Outputs.BootstrapStateMachineArn
