AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ETL pipeline for bdo-market-insights: the shared bdo-common Lambda layer,
  six ETL functions, the Step Functions state machine (hourly), and the
  daily retention sweep (EventBridge).

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
  BdoRegion:
    Type: String
    Description: BDO server region injected into the hourly ETL trigger input
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: SG for in-VPC Lambdas (egress to RDS)
  PrivateSubnetA:
    Type: AWS::EC2::Subnet::Id
    Description: Primary private subnet; in-VPC Lambdas run here only (ADR-0011)
  DynamoDbTableName:
    Type: String
    Description: per-stage items table name (bdo-<stage>-items)
  RdsEndpoint:
    Type: String
    Description: RDS Postgres endpoint address
  RdsPort:
    Type: String
    Description: RDS Postgres port
  LambdaRdsAuthRoleArn:
    Type: String
    Description: Execution role for in-VPC Lambdas (VPC + X-Ray + rds-db:connect)
  LambdaMigratorRoleArn:
    Type: String
    Description: Execution role for the in-VPC migrator Lambda (rds-db:connect as lambda_migrator)
  AutoMigrate:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      When 'true', a custom resource runs `alembic upgrade head` (as
      lambda_migrator via IAM) on every deploy whose MigrationsFingerprint
      changed. Set 'false' for a brand-new environment's first deploy, before
      `make db-bootstrap` has created the roles the migrator authenticates as.
  MigrationsFingerprint:
    Type: String
    Default: unset
    Description: >
      Content hash of migrations/versions, supplied by `make deploy`. Changing
      it is what triggers the auto-migrate custom resource to re-run; a no-op
      deploy (same migrations) does not re-invoke the migrator.
  LogRetentionInDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 180, 365, 400, 545, 731, 1827, 3653]
    Description: Retention for this stack's Lambda log groups (default 30, matches the API SLO window)

Conditions:
  DoAutoMigrate: !Equals [!Ref AutoMigrate, 'true']

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Tracing: Active
    Layers:
      - !Ref CommonLayer
    Environment:
      Variables:
        STAGE: !Ref Stage
        BDO_REGION: !Ref BdoRegion
        POWERTOOLS_SERVICE_NAME: bdo-market-insights
        POWERTOOLS_METRICS_NAMESPACE: BdoMarket

Resources:
  # ──────────────────────────────────────────────
  # Shared layer (ADR-0003) — bdo_common + runtime deps
  # ──────────────────────────────────────────────
  # build_layer.py bundles the hand-authored bdo_common package alongside the
  # pip deps under python/. The stock `BuildMethod: python3.12` installs only
  # requirements.txt and omits bdo_common, breaking every function at import.
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Metadata:
      BuildMethod: makefile
    Properties:
      LayerName: !Sub 'bdo-${Stage}-common'
      Description: Shared bdo_common code and runtime dependencies
      ContentUri: ../src/layer
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete

  # ──────────────────────────────────────────────
  # ETL functions — not in VPC (DynamoDB / arsha.io / pure)
  # ──────────────────────────────────────────────
  RetrieveItemsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bdo-${Stage}-retrieve-items'
      CodeUri: ../src/functions/retrieve_items
      Handler: app.handler
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref DynamoDbTableName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DynamoDbTableName

  FetchDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bdo-${Stage}-fetch-data'
      CodeUri: ../src/functions/fetch_data
      Handler: app.handler
      Timeout: 60

  CleanDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bdo-${Stage}-clean-data'
      CodeUri: ../src/functions/clean_data
      Handler: app.handler

  # ──────────────────────────────────────────────
  # ETL functions — in VPC (RDS via IAM auth)
  # ──────────────────────────────────────────────
  StoreDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bdo-${Stage}-store-data'
      CodeUri: ../src/functions/store_data
      Handler: app.handler
      Role: !Ref LambdaRdsAuthRoleArn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds:
          - !Ref PrivateSubnetA
      Environment:
        Variables:
          DB_HOST: !Ref RdsEndpoint
          DB_PORT: !Ref RdsPort
          DB_NAME: bdo
          DB_USER: lambda_rds_user
          USE_IAM_AUTH: 'true'

  RollupDailyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bdo-${Stage}-rollup-daily'
      CodeUri: ../src/functions/rollup_daily
      Handler: app.handler
      Role: !Ref LambdaRdsAuthRoleArn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds:
          - !Ref PrivateSubnetA
      Environment:
        Variables:
          DB_HOST: !Ref RdsEndpoint
          DB_PORT: !Ref RdsPort
          DB_NAME: bdo
          DB_USER: lambda_rds_user
          USE_IAM_AUTH: 'true'

  PurgeOldSnapshotsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bdo-${Stage}-purge-old-snapshots'
      CodeUri: ../src/functions/purge_old_snapshots
      Handler: app.handler
      Role: !Ref LambdaRdsAuthRoleArn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds:
          - !Ref PrivateSubnetA
      Environment:
        Variables:
          DB_HOST: !Ref RdsEndpoint
          DB_PORT: !Ref RdsPort
          DB_NAME: bdo
          DB_USER: lambda_rds_user
          USE_IAM_AUTH: 'true'
      Events:
        DailyRetentionSweep:
          Type: Schedule
          Properties:
            Schedule: cron(30 0 * * ? *)
            Description: Delete market_snapshot rows older than 90 days (FR-7)

  # ──────────────────────────────────────────────
  # Migrator — in VPC; runs `alembic upgrade head` on deploy (no schedule)
  # ──────────────────────────────────────────────
  # Invoked by the CI deploy job (and `make migrate-lambda` for dev), not on a
  # timer. Connects as the privileged `lambda_migrator` role via IAM auth. The
  # makefile build bundles the repo-root migrations/ tree into the package; the
  # alembic/SQLAlchemy engine ships in the package, psycopg in the shared layer.
  MigratorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub 'bdo-${Stage}-migrator'
      CodeUri: ../src/functions/migrator
      Handler: app.handler
      Timeout: 120
      MemorySize: 512
      Role: !Ref LambdaMigratorRoleArn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds:
          - !Ref PrivateSubnetA
      Environment:
        Variables:
          DB_HOST: !Ref RdsEndpoint
          DB_PORT: !Ref RdsPort
          DB_NAME: bdo
          DB_USER: lambda_migrator
          USE_IAM_AUTH: 'true'

  # ──────────────────────────────────────────────
  # Auto-migrate custom resource — routine `upgrade head` on deploy
  # ──────────────────────────────────────────────
  # Invokes MigratorFunction on every stack update whose MigrationsFingerprint
  # changed (a no-op deploy does not re-run it). The migrator applies routine
  # migrations as lambda_migrator via IAM auth and always signals CloudFormation,
  # so a failed migration fails the deploy rather than hanging it. The one-time
  # privileged role bootstrap (0001-0003) is NOT run here -- it needs the master
  # user and is applied once per environment via `make db-bootstrap`.
  SchemaMigration:
    Type: AWS::CloudFormation::CustomResource
    Condition: DoAutoMigrate
    Properties:
      ServiceToken: !GetAtt MigratorFunction.Arn
      # Re-run trigger: when the migrations content hash changes, this property
      # changes and CloudFormation re-invokes the migrator.
      MigrationsFingerprint: !Ref MigrationsFingerprint

  # ──────────────────────────────────────────────
  # Admin query — in VPC; ad-hoc SQL (ADR-0026), invoke-only
  # ──────────────────────────────────────────────
  # Replaces human pgAdmin-over-bastion access. Connects as the runtime
  # `lambda_rds_user` role via IAM auth and runs each statement in a Postgres
  # READ ONLY transaction by default (writes are rejected by the DB); an explicit
  # {"write": true} payload runs DML in a committing transaction. Because
  # lambda_rds_user holds no DDL/ownership, schema changes still go through
  # migrations. No schedule and no API event -- invoked directly (`make
  # db-admin`), gated by IAM (lambda:InvokeFunction).
  AdminQueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bdo-${Stage}-admin-query'
      CodeUri: ../src/functions/admin_query
      Handler: app.handler
      Timeout: 60
      Role: !Ref LambdaRdsAuthRoleArn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds:
          - !Ref PrivateSubnetA
      Environment:
        Variables:
          DB_HOST: !Ref RdsEndpoint
          DB_PORT: !Ref RdsPort
          DB_NAME: bdo
          DB_USER: lambda_rds_user
          USE_IAM_AUTH: 'true'

  # ──────────────────────────────────────────────
  # Step Functions state machine (hourly ETL, FR-1)
  # ──────────────────────────────────────────────
  EtlStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub 'bdo-${Stage}-etl'
      Type: STANDARD
      Tracing:
        Enabled: true
      DefinitionSubstitutions:
        RetrieveItemsArn: !GetAtt RetrieveItemsFunction.Arn
        FetchDataArn: !GetAtt FetchDataFunction.Arn
        CleanDataArn: !GetAtt CleanDataFunction.Arn
        StoreDataArn: !GetAtt StoreDataFunction.Arn
        RollupDailyArn: !GetAtt RollupDailyFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref RetrieveItemsFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref FetchDataFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CleanDataFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref StoreDataFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref RollupDailyFunction
      Events:
        HourlyEtl:
          Type: Schedule
          Properties:
            Schedule: cron(0 * * * ? *)
            Input: !Sub '{"region": "${BdoRegion}"}'
            Description: Hourly market snapshot ingestion (FR-1)
      Definition:
        Comment: BDO hourly market-data ETL
        StartAt: RetrieveItems
        States:
          RetrieveItems:
            Type: Task
            Resource: '${RetrieveItemsArn}'
            Parameters:
              region.$: '$.region'
              execution_start_time.$: '$$.Execution.StartTime'
            Retry:
              - ErrorEquals:
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2
            Next: ProcessBatches
          ProcessBatches:
            Type: Map
            ItemsPath: '$.batches'
            MaxConcurrency: 5
            ResultPath: '$.batch_results'
            ItemProcessor:
              ProcessorConfig:
                Mode: INLINE
              StartAt: FetchData
              States:
                FetchData:
                  Type: Task
                  Resource: '${FetchDataArn}'
                  Retry:
                    - ErrorEquals:
                        - Lambda.ServiceException
                        - Lambda.AWSLambdaException
                        - Lambda.SdkClientException
                        - Lambda.TooManyRequestsException
                        - States.Timeout
                      IntervalSeconds: 3
                      MaxAttempts: 3
                      BackoffRate: 2
                  Next: CleanData
                CleanData:
                  Type: Task
                  Resource: '${CleanDataArn}'
                  Retry:
                    - ErrorEquals:
                        - Lambda.ServiceException
                        - Lambda.AWSLambdaException
                        - Lambda.SdkClientException
                        - Lambda.TooManyRequestsException
                      IntervalSeconds: 2
                      MaxAttempts: 3
                      BackoffRate: 2
                  Next: StoreData
                StoreData:
                  Type: Task
                  Resource: '${StoreDataArn}'
                  Retry:
                    - ErrorEquals:
                        - Lambda.ServiceException
                        - Lambda.AWSLambdaException
                        - Lambda.SdkClientException
                        - Lambda.TooManyRequestsException
                      IntervalSeconds: 2
                      MaxAttempts: 3
                      BackoffRate: 2
                  End: true
            Next: IsDayFirstRun
          IsDayFirstRun:
            Type: Choice
            Choices:
              - Variable: '$.is_day_first_run'
                BooleanEquals: true
                Next: RollupDaily
            Default: Done
          RollupDaily:
            Type: Task
            Resource: '${RollupDailyArn}'
            Parameters:
              region.$: '$.region'
              snapshot_at.$: '$.snapshot_at'
            Retry:
              - ErrorEquals:
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2
            End: true
          Done:
            Type: Succeed

Outputs:
  CommonLayerArn:
    Value: !Ref CommonLayer
    Export:
      Name: !Sub '${AWS::StackName}-CommonLayerArn'

  EtlStateMachineArn:
    Value: !Ref EtlStateMachine
    Export:
      Name: !Sub '${AWS::StackName}-EtlStateMachineArn'
