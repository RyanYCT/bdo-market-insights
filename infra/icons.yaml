AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Item-icon materializer for bdo-market-insights: a daily Lambda that fetches
  icons from the Pearl Abyss CDN for tracked items missing them
  (icon_status=unset) and writes them to the shared delivery bucket. The bucket
  and its CloudFront distribution are owned by the cdn stack (ADR-0032); this
  stack is a producer that writes icons/<id>.png into it. Not in a VPC -- needs
  the public internet (Pearl CDN), DynamoDB, and S3 only.

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
  BdoRegion:
    Type: String
    Description: BDO region; upper-cased into the Pearl CDN icon path (e.g. tw -> TW)
  CommonLayerArn:
    Type: String
    Description: ARN of the shared bdo-common Lambda layer (from the platform stack, ADR-0032)
  DynamoDbTableName:
    Type: String
    Description: per-stage items table name (bdo-<stage>-items)
  CdnBucketName:
    Type: String
    Description: Delivery bucket name (from the cdn stack, ADR-0032); iconSync writes icons/* here.
  IconSyncSchedule:
    Type: String
    Default: 'cron(0 9 ? * * *)'
    Description: >
      EventBridge cron (UTC) for the daily icon materializer. Default 09:00 UTC.
      Only processes tracked items with icon_status=unset, so it is a no-op once
      every tracked item's icon is stored/missing; new tracked items get an icon
      by the next run.
  LogRetentionInDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 180, 365, 400, 545, 731, 1827, 3653]
    Description: Retention for this stack's Lambda log groups (default 30, matches the API SLO window)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Tracing: Active
    Layers:
      - !Ref CommonLayerArn
    Environment:
      Variables:
        STAGE: !Ref Stage
        BDO_REGION: !Ref BdoRegion
        POWERTOOLS_SERVICE_NAME: bdo-market-insights
        POWERTOOLS_METRICS_NAMESPACE: BdoMarket

Resources:
  # ──────────────────────────────────────────────
  # iconSync — daily materializer, not in VPC (Pearl CDN + DynamoDB + S3).
  # Writes into the cdn stack's delivery bucket (icons/<id>.png).
  # ──────────────────────────────────────────────
  IconSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bdo-${Stage}-icon-sync'
      CodeUri: ../src/functions/icon_sync
      Handler: app.handler
      Timeout: 300
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref DynamoDbTableName
          ICONS_BUCKET: !Ref CdnBucketName
      Policies:
        # Read tracked items (Query tracked-index) + set icon_status (UpdateItem).
        - DynamoDBCrudPolicy:
            TableName: !Ref DynamoDbTableName
        # Write materialized icons into the shared delivery bucket.
        - S3WritePolicy:
            BucketName: !Ref CdnBucketName
      Events:
        DailyIconSync:
          Type: Schedule
          Properties:
            Schedule: !Ref IconSyncSchedule
            Description: Daily icon materialization for tracked items (icon_status=unset)

  # Log group co-located with the function (ADR-0030); created before the
  # bootstrap orchestrator can invoke iconSync.
  IconSyncLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/bdo-${Stage}-icon-sync'
      RetentionInDays: !Ref LogRetentionInDays

Outputs:
  IconSyncFunctionArn:
    Value: !GetAtt IconSyncFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-IconSyncFunctionArn'
