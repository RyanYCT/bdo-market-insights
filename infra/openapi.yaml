info:
  title: BDO Market Insights API
  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/insights:
    get:
      operationId: get_insights_v1_insights_get
      parameters:
      - description: 'BDO server region. Accepted: na, eu, sea, mena, kr, ru, jp,
          th, tw, sa, console_eu, console_na, console_asia. Default: tw.'
        in: query
        name: region
        required: false
        schema:
          default: tw
          description: 'BDO server region. Accepted: na, eu, sea, mena, kr, ru, jp,
            th, tw, sa, console_eu, console_na, console_asia. Default: tw.'
          enum:
          - na
          - eu
          - sea
          - mena
          - kr
          - ru
          - jp
          - th
          - tw
          - sa
          - console_eu
          - console_na
          - console_asia
          title: Region
          type: string
      - description: 'Summary cadence. Accepted: daily, weekly. Default: daily.'
        in: query
        name: period
        required: false
        schema:
          default: daily
          description: 'Summary cadence. Accepted: daily, weekly. Default: daily.'
          enum:
          - daily
          - weekly
          title: Period
          type: string
      - description: 'Summary date, ISO-8601 (YYYY-MM-DD). Default: latest available.'
        in: query
        name: date
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: 'Summary date, ISO-8601 (YYYY-MM-DD). Default: latest available.'
          title: Date
      - description: 'Narrative language code. Default: en.'
        in: query
        name: lang
        required: false
        schema:
          default: en
          description: 'Narrative language code. Default: en.'
          title: Lang
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Return
                type: string
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: GET /v1/insights
  /v1/items:
    get:
      operationId: list_items_v1_items_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemListResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: GET /v1/items
    post:
      operationId: create_item_v1_items_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: POST /v1/items
  /v1/items/{item_id}:
    delete:
      operationId: delete_item_v1_items__item_id__delete
      parameters:
      - in: path
        name: item_id
        required: true
        schema:
          title: Item Id
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Return
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: DELETE /v1/items/{item_id}
    get:
      operationId: get_item_v1_items__item_id__get
      parameters:
      - in: path
        name: item_id
        required: true
        schema:
          title: Item Id
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: GET /v1/items/{item_id}
    patch:
      operationId: update_item_v1_items__item_id__patch
      parameters:
      - in: path
        name: item_id
        required: true
        schema:
          title: Item Id
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: PATCH /v1/items/{item_id}
  /v1/market/items/{item_id}/analysis:
    get:
      operationId: get_analysis_v1_market_items__item_id__analysis_get
      parameters:
      - in: path
        name: item_id
        required: true
        schema:
          title: Item Id
          type: integer
      - description: 'BDO server region. Accepted: na, eu, sea, mena, kr, ru, jp,
          th, tw, sa, console_eu, console_na, console_asia. Default: tw.'
        in: query
        name: region
        required: false
        schema:
          default: tw
          description: 'BDO server region. Accepted: na, eu, sea, mena, kr, ru, jp,
            th, tw, sa, console_eu, console_na, console_asia. Default: tw.'
          enum:
          - na
          - eu
          - sea
          - mena
          - kr
          - ru
          - jp
          - th
          - tw
          - sa
          - console_eu
          - console_na
          - console_asia
          title: Region
          type: string
      - description: 'Enhancement sub-id. Default: 0 (the base item).'
        in: query
        name: sid
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: 'Enhancement sub-id. Default: 0 (the base item).'
          title: Sid
      - description: 'Trailing analytics window in days. Range: 1-90. Default: 14.
          Needs at least 7 daily points.'
        in: query
        name: window_days
        required: false
        schema:
          default: 14
          description: 'Trailing analytics window in days. Range: 1-90. Default: 14.
            Needs at least 7 daily points.'
          maximum: 90.0
          minimum: 1.0
          title: Window Days
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Return
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: GET /v1/market/items/{item_id}/analysis
  /v1/market/items/{item_id}/daily:
    get:
      operationId: get_daily_v1_market_items__item_id__daily_get
      parameters:
      - in: path
        name: item_id
        required: true
        schema:
          title: Item Id
          type: integer
      - description: 'BDO server region. Accepted: na, eu, sea, mena, kr, ru, jp,
          th, tw, sa, console_eu, console_na, console_asia. Default: tw.'
        in: query
        name: region
        required: false
        schema:
          default: tw
          description: 'BDO server region. Accepted: na, eu, sea, mena, kr, ru, jp,
            th, tw, sa, console_eu, console_na, console_asia. Default: tw.'
          enum:
          - na
          - eu
          - sea
          - mena
          - kr
          - ru
          - jp
          - th
          - tw
          - sa
          - console_eu
          - console_na
          - console_asia
          title: Region
          type: string
      - description: 'Enhancement sub-id. Default: all sids.'
        in: query
        name: sid
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: 'Enhancement sub-id. Default: all sids.'
          title: Sid
      - description: 'Lower bound, inclusive, ISO-8601 date (YYYY-MM-DD). Default:
          unbounded.'
        in: query
        name: from
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: 'Lower bound, inclusive, ISO-8601 date (YYYY-MM-DD). Default:
            unbounded.'
          title: From
      - description: 'Upper bound, inclusive, ISO-8601 date (YYYY-MM-DD). Default:
          unbounded.'
        in: query
        name: to
        required: false
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          description: 'Upper bound, inclusive, ISO-8601 date (YYYY-MM-DD). Default:
            unbounded.'
          title: To
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Return
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: GET /v1/market/items/{item_id}/daily
  /v1/market/items/{item_id}/snapshots:
    get:
      operationId: get_snapshots_v1_market_items__item_id__snapshots_get
      parameters:
      - in: path
        name: item_id
        required: true
        schema:
          title: Item Id
          type: integer
      - description: 'BDO server region. Accepted: na, eu, sea, mena, kr, ru, jp,
          th, tw, sa, console_eu, console_na, console_asia. Default: tw.'
        in: query
        name: region
        required: false
        schema:
          default: tw
          description: 'BDO server region. Accepted: na, eu, sea, mena, kr, ru, jp,
            th, tw, sa, console_eu, console_na, console_asia. Default: tw.'
          enum:
          - na
          - eu
          - sea
          - mena
          - kr
          - ru
          - jp
          - th
          - tw
          - sa
          - console_eu
          - console_na
          - console_asia
          title: Region
          type: string
      - description: 'Enhancement sub-id. Default: all sids.'
        in: query
        name: sid
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: 'Enhancement sub-id. Default: all sids.'
          title: Sid
      - description: 'Lower bound, inclusive, ISO-8601 datetime. Default: unbounded.'
        in: query
        name: from
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: 'Lower bound, inclusive, ISO-8601 datetime. Default: unbounded.'
          title: From
      - description: 'Upper bound, inclusive, ISO-8601 datetime. Default: unbounded.'
        in: query
        name: to
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: 'Upper bound, inclusive, ISO-8601 datetime. Default: unbounded.'
          title: To
      - description: 'Max snapshots returned. Range: 1-1000. Default: 168 (one week
          of hourly points). Out-of-range is clamped. For longer ranges use the daily
          endpoint.'
        in: query
        name: limit
        required: false
        schema:
          default: 168
          description: 'Max snapshots returned. Range: 1-1000. Default: 168 (one week
            of hourly points). Out-of-range is clamped. For longer ranges use the
            daily endpoint.'
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
