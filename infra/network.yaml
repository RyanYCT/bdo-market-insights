AWSTemplateFormatVersion: '2010-09-09'
Description: >
  VPC, private subnets, route table, DynamoDB Gateway Endpoint,
  and security groups for bdo-market-insights.

Parameters:
  Stage:
    Type: String
    AllowedValues:
      - dev
      - prod

Resources:
  # ──────────────────────────────────────────────
  # VPC
  # ──────────────────────────────────────────────
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub 'bdo-${Stage}-vpc'

  # ──────────────────────────────────────────────
  # Private Subnets
  # ──────────────────────────────────────────────
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/25
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub 'bdo-${Stage}-private-a'

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.128/25
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub 'bdo-${Stage}-private-b'

  # ──────────────────────────────────────────────
  # Route Table (private — no internet routes)
  # ──────────────────────────────────────────────
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub 'bdo-${Stage}-private-rt'

  SubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  SubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # ──────────────────────────────────────────────
  # DynamoDB Gateway VPC Endpoint
  # ──────────────────────────────────────────────
  DynamoDbEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.dynamodb'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  # ──────────────────────────────────────────────
  # S3 Gateway VPC Endpoint
  # ──────────────────────────────────────────────
  # Lets the in-VPC migrator Lambda POST its CloudFormation custom-resource
  # response to the CFN-presigned S3 URL without NAT/internet (ADR-0006). A
  # gateway endpoint has no hourly cost; it adds an in-region S3 route to the
  # private route table via the S3 managed prefix list.
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  # ──────────────────────────────────────────────
  # Security Groups
  # ──────────────────────────────────────────────
  LambdaSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Lambda functions
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub 'bdo-${Stage}-lambda-sg'

  RdsSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS Postgres
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub 'bdo-${Stage}-rds-sg'

  # Security group for on-demand break-glass access (ADR-0027). Inert and free
  # while nothing uses it; the on-demand break-glass stack (infra/break-glass.yaml,
  # deployed via `make break-glass-up`) attaches its EC2 instance + EICE to it.
  BreakGlassSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for on-demand break-glass access (EICE connectivity)
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub 'bdo-${Stage}-break-glass-sg'

  # NOTE: Adding any standalone AWS::EC2::SecurityGroupEgress rule causes EC2 to
  # drop the implicit allow-all-egress rule for that SG, so each SG below is
  # restricted to exactly the egress declared here. In a no-NAT VPC (ADR-0006)
  # the only reachable destinations are in-VPC (RDS) and the DynamoDB gateway
  # endpoint (via its prefix list); the in-VPC Lambdas only need RDS, so 5432 is
  # all they require. The break-glass host additionally needs SSH egress to
  # itself so the co-located EICE can reach it (see BreakGlassSshEgress).

  # -- Lambda SG Egress --
  LambdaToRdsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LambdaSG
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref RdsSG
      Description: Allow Lambda to connect to RDS Postgres

  # HTTPS egress so the migrator Lambda can reach S3 (via the S3 gateway
  # endpoint) to signal CloudFormation, and any in-VPC Lambda can reach the
  # DynamoDB/S3 gateway endpoints. The wide CIDR is safe here: the private route
  # table has no default (0.0.0.0/0) route, so 443 can only reach the
  # gateway-endpoint-backed AWS services -- all other destinations are dropped
  # by routing, not by the SG. (The standalone egress rules above remove the
  # implicit allow-all, so this must be declared explicitly.)
  LambdaToHttpsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LambdaSG
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: Allow Lambda HTTPS egress to AWS gateway endpoints (S3/DynamoDB)

  # ── RDS SG Ingress ──
  RdsFromLambdaIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSG
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref LambdaSG
      Description: Allow inbound Postgres from Lambda

  RdsFromBreakGlassIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSG
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref BreakGlassSG
      Description: Allow inbound Postgres from the break-glass host

  # -- Break-glass SG Ingress --
  # The EC2 Instance Connect Endpoint shares this SG, so the break-glass
  # instance must allow SSH from the same SG for the operator tunnel
  # (operator -> EICE -> host :22 -> RDS :5432) to form. Without this
  # rule the host is unreachable.
  BreakGlassSshIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref BreakGlassSG
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      SourceSecurityGroupId: !Ref BreakGlassSG
      Description: Allow SSH from the EC2 Instance Connect Endpoint

  # -- Break-glass SG Egress --
  # The EICE shares this SG and connects to the host on :22 with
  # PreserveClientIp=false, so the traffic's source is this SG. Because the
  # standalone egress rules above remove the implicit allow-all, the host
  # needs an explicit self-referencing SSH egress rule or the EICE cannot reach
  # it (operator -> EICE -> host :22). Without this the tunnel fails with
  # "Websocket Closure Reason: Unable to connect to target".
  BreakGlassSshEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref BreakGlassSG
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      DestinationSecurityGroupId: !Ref BreakGlassSG
      Description: Allow the co-located EICE to reach the host on SSH

  BreakGlassToRdsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref BreakGlassSG
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref RdsSG
      Description: Allow the break-glass host to connect to RDS Postgres

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export:
      Name: !Sub '${AWS::StackName}-VpcId'

  PrivateSubnetA:
    Value: !Ref PrivateSubnetA
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnetA'

  PrivateSubnetB:
    Value: !Ref PrivateSubnetB
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnetB'

  PrivateSubnetAAZ:
    Value: !GetAtt PrivateSubnetA.AvailabilityZone
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnetAAZ'

  LambdaSecurityGroupId:
    Value: !Ref LambdaSG
    Export:
      Name: !Sub '${AWS::StackName}-LambdaSecurityGroupId'

  RdsSecurityGroupId:
    Value: !Ref RdsSG
    Export:
      Name: !Sub '${AWS::StackName}-RdsSecurityGroupId'

  BreakGlassSecurityGroupId:
    Value: !Ref BreakGlassSG
    Export:
      Name: !Sub '${AWS::StackName}-BreakGlassSecurityGroupId'
