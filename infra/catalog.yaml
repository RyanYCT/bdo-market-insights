AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Catalog sync for bdo-market-insights: a weekly Lambda that pulls the full BDO
  item catalog from arsha.io util/db and partial-upserts it into the items table
  (ETL-owned fields preserved, ADR-0018). Not in a VPC -- needs the public
  internet (arsha.io) and DynamoDB only, so it mirrors itemRegistry's placement.

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
  CommonLayerArn:
    Type: String
    Description: ARN of the shared bdo-common Lambda layer (from the ETL stack)
  DynamoDbTableName:
    Type: String
    Description: per-stage items table name (bdo-<stage>-items)
  IconsBucketName:
    Type: String
    Description: >
      Icons bucket name (from the icons stack). catalogSync writes the static
      catalog artifact under catalog/* here, served via the shared icons CDN
      (ADR-0031).
  IconBaseUrl:
    Type: String
    Description: >
      Public base URL of the icons CDN (from the icons stack), baked into the
      artifact's icon_url values so a catalog entry's icon resolves directly.
  CatalogSyncSchedule:
    Type: String
    Default: 'cron(0 8 ? * THU *)'
    Description: >
      EventBridge cron (UTC) for the weekly catalog sync. Default Thu 08:00 UTC
      (= Thu 16:00 UTC+8). BDO maintenance is Thu 03:00-07:00 UTC+8
      (= Wed 19:00-23:00 UTC) and can overrun on new-item patches; this leaves a
      generous buffer so new items are live in util/db before the sync runs. The
      sync is idempotent, so an early run simply catches new items the next week.
  CatalogLangs:
    Type: String
    Default: 'en,tw'
    Description: >
      Comma-separated arsha util/db languages to sync. English is the canonical
      name (stored on `name`); others go in the `names` map.
  LogRetentionInDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 180, 365, 400, 545, 731, 1827, 3653]
    Description: Retention for this stack's Lambda log groups (default 30, matches the API SLO window)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Tracing: Active
    Layers:
      - !Ref CommonLayerArn
    Environment:
      Variables:
        STAGE: !Ref Stage
        POWERTOOLS_SERVICE_NAME: bdo-market-insights
        POWERTOOLS_METRICS_NAMESPACE: BdoMarket

Resources:
  # ──────────────────────────────────────────────
  # catalogSync — full-catalog upsert, not in VPC (arsha.io + DynamoDB)
  # ──────────────────────────────────────────────
  CatalogSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bdo-${Stage}-catalog-sync'
      CodeUri: ../src/functions/catalog_sync
      Handler: app.handler
      # The full catalog is ~tens of thousands of items across languages; the
      # write pass is concurrent but still wants a long ceiling and headroom.
      Timeout: 900
      MemorySize: 1024
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref DynamoDbTableName
          CATALOG_LANGS: !Ref CatalogLangs
          # SSM parameter holding the last-synced catalog content checksum; the
          # sync skips all writes when the fetched catalog matches it.
          CATALOG_CHECKSUM_PARAM: !Sub '/bdo-market-insights/${Stage}/catalog/checksum'
          # Publish the full-catalog CDN artifact into the icons bucket, with
          # icon_url values pointing at the icons CDN (ADR-0031).
          CATALOG_ARTIFACT_BUCKET: !Ref IconsBucketName
          ICON_BASE_URL: !Ref IconBaseUrl
      Policies:
        # Read (Scan) to diff current state + write the changed items.
        - DynamoDBCrudPolicy:
            TableName: !Ref DynamoDbTableName
        # Read/write only the catalog checksum parameter.
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
              Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/bdo-market-insights/${Stage}/catalog/checksum'
        # Write only the catalog artifact prefix in the icons bucket.
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${IconsBucketName}/catalog/*'
      Events:
        WeeklyCatalogSync:
          Type: Schedule
          Properties:
            Schedule: !Ref CatalogSyncSchedule
            Description: Weekly full-catalog sync from arsha.io util/db (post-maintenance)

  # ──────────────────────────────────────────────
  # Log group — co-located with the function (ADR-0030). Created before the
  # bootstrap orchestrator can invoke catalogSync, so the managed group wins.
  # ──────────────────────────────────────────────
  CatalogSyncLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/bdo-${Stage}-catalog-sync'
      RetentionInDays: !Ref LogRetentionInDays

Outputs:
  CatalogSyncFunctionArn:
    Value: !GetAtt CatalogSyncFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-CatalogSyncFunctionArn'
