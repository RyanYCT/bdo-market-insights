AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Delivery CDN (Tier 0, ADR-0032) for bdo-market-insights: a private S3 bucket
  fronted by a CloudFront distribution (Origin Access Control) that serves
  public static assets — self-hosted item icons (icons/<id>.png, ADR-0023) and
  the full-catalog artifact (catalog/catalog.json, ADR-0031, CORS-enabled).
  Owned here, below its producers (the icons and catalog stacks) and consumers
  (the api stack). The bucket keeps its physical name (bdo-<stage>-icons) so the
  resource can be moved in-place rather than recreated. Deploys in us-east-1
  (CloudFront ACM requirement).

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
  CdnDomainName:
    Type: String
    Default: 'none'
    Description: >
      Custom hostname for the CDN (e.g. cdn.example.com). "none" uses the
      CloudFront default *.cloudfront.net domain. Resolved from SSM by the parent
      (ADR-0024); not stored in committed config (ADR-0013 convention).
  HostedZoneId:
    Type: String
    Default: 'none'
    Description: >
      Route 53 hosted zone ID for the parent domain (shared infra; ADR-0013).
      Required when CdnDomainName is set.
  LogRetentionInDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 180, 365, 400, 545, 731, 1827, 3653]
    Description: Retention for this stack's Lambda log groups (default 30, matches the API SLO window)

Conditions:
  # See ADR-0019: prod keeps materialized assets across a stack delete (Retain);
  # dev is disposable, so a stack delete also removes the bucket (Delete),
  # unblocking a later fresh CREATE with the same fixed bucket name.
  IsProd: !Equals [!Ref Stage, 'prod']
  IsNotProd: !Not [!Equals [!Ref Stage, 'prod']]
  # Custom domain is opt-in (ADR-0013): "none" -> serve on the CloudFront default
  # domain, no ACM cert / Route 53 record ("none" is the SSM sentinel, ADR-0024).
  HasCdnDomain: !Not [!Equals [!Ref CdnDomainName, 'none']]

Resources:
  # ──────────────────────────────────────────────
  # Delivery bucket — private; served publicly only through CloudFront OAC below.
  # Physical name kept as bdo-<stage>-icons (ADR-0032): renaming would force
  # recreation, so the name is retained even though the bucket now also holds
  # the catalog artifact.
  # ──────────────────────────────────────────────
  DeliveryBucket:
    Type: AWS::S3::Bucket
    # Prod retains assets across a stack delete (re-fetchable, but keeping them
    # avoids a re-scrape of the tracked set). Dev is disposable: Delete lets the
    # bucket actually go away on teardown, so a later fresh CREATE with this same
    # fixed name does not collide with a retained leftover (ADR-0019). S3 refuses
    # to delete a non-empty bucket, so DeliveryBucketJanitor (non-prod) empties
    # it first.
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BucketName: !Sub 'bdo-${Stage}-icons'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ──────────────────────────────────────────────
  # CloudFront + Origin Access Control over the private bucket (ADR-0023). The
  # bucket stays fully private (block-public-access on); only this distribution
  # can read it, via a SigV4-signed OAC request scoped by SourceArn in the bucket
  # policy. Serves icons/<id>.png and catalog/catalog.json.
  # ──────────────────────────────────────────────
  DeliveryOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'bdo-${Stage}-cdn-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DeliveryDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'bdo-${Stage} delivery CDN (icons + catalog)'
        # NA + EU edges only — cheapest tier; assets are small and cache well.
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases: !If [HasCdnDomain, [!Ref CdnDomainName], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasCdnDomain
          - AcmCertificateArn: !Ref DeliveryCertificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: DeliveryBucketOrigin
            DomainName: !GetAtt DeliveryBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt DeliveryOriginAccessControl.Id
            # OAC (not the legacy OAI) -> empty OriginAccessIdentity.
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: DeliveryBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # AWS managed "CachingOptimized" policy (honours the bucket's
          # Cache-Control: public, max-age=604800 on stored icons).
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        # Serve the full-catalog artifact (catalog/catalog.json) with CORS
        # (ADR-0031). Unlike icons (loaded via <img>, no CORS), the frontend
        # fetches this JSON via fetch(), so it needs CORS headers. Stored as
        # plain JSON; Compress lets CloudFront gzip/brotli it on the wire.
        # CachingOptimized honours the object's Cache-Control (max-age=3600).
        CacheBehaviors:
          - PathPattern: catalog/*
            TargetOriginId: DeliveryBucketOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            # AWS managed "SimpleCORS" response-headers policy
            # (Access-Control-Allow-Origin: *) -- the catalog is public,
            # read-only reference data.
            ResponseHeadersPolicyId: 60669652-455b-4ae9-85a4-c4c02393f86c

  # Grant read to only this distribution (OAC + SourceArn). Not a public policy
  # (service principal, not "*"), so it coexists with block-public-access.
  DeliveryBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DeliveryBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::bdo-${Stage}-icons/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${DeliveryDistribution}'

  # Custom domain (opt-in). CloudFront requires the cert in us-east-1; this
  # stack deploys there (samconfig), so an in-stack cert is valid.
  DeliveryCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasCdnDomain
    Properties:
      DomainName: !Ref CdnDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref CdnDomainName
          HostedZoneId: !Ref HostedZoneId

  DeliveryDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCdnDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref CdnDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt DeliveryDistribution.DomainName
        # Fixed global CloudFront hosted-zone ID (all distributions).
        HostedZoneId: Z2FDTNDATAQYW2

  # ──────────────────────────────────────────────
  # deliveryBucketJanitor — non-prod only. Empties DeliveryBucket on stack
  # Delete so CloudFormation's own (non-retaining) bucket delete can succeed; S3
  # refuses to delete a non-empty bucket. Pure stdlib (no shared layer). ADR-0019.
  # ──────────────────────────────────────────────
  DeliveryBucketJanitorFunction:
    Type: AWS::Serverless::Function
    Condition: IsNotProd
    Properties:
      FunctionName: !Sub 'bdo-${Stage}-cdn-bucket-janitor'
      CodeUri: ../src/functions/bucket_janitor
      Handler: app.handler
      Runtime: python3.12
      Timeout: 300
      MemorySize: 256
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !Sub 'arn:aws:s3:::bdo-${Stage}-icons'
            - Effect: Allow
              Action:
                - s3:DeleteObject
                - s3:DeleteObjectVersion
              Resource: !Sub 'arn:aws:s3:::bdo-${Stage}-icons/*'

  DeliveryBucketJanitor:
    Type: Custom::DeliveryBucketJanitor
    Condition: IsNotProd
    # CloudFormation invokes the backing Lambda for the Create event during the
    # deploy, so its log group must already exist -- otherwise the Lambda runtime
    # auto-creates an unmanaged group that the managed one then collides with.
    DependsOn: DeliveryBucketJanitorLogGroup
    Properties:
      ServiceToken: !GetAtt DeliveryBucketJanitorFunction.Arn
      # !Ref on the bucket also creates the dependency that makes CloudFormation
      # invoke this custom resource's Delete *before* it deletes DeliveryBucket
      # -- the ordering the janitor relies on.
      BucketName: !Ref DeliveryBucket

  DeliveryBucketJanitorLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsNotProd
    Properties:
      LogGroupName: !Sub '/aws/lambda/bdo-${Stage}-cdn-bucket-janitor'
      RetentionInDays: !Ref LogRetentionInDays

Outputs:
  BucketName:
    Description: Delivery bucket name; producers write icons/* and catalog/* here.
    Value: !Ref DeliveryBucket
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'

  # Public delivery base; append /icons/<id>.png or /catalog/catalog.json.
  # Custom domain when set, else the CloudFront default domain.
  BaseUrl:
    Description: Public base URL for CDN assets.
    Value: !If
      - HasCdnDomain
      - !Sub 'https://${CdnDomainName}'
      - !Sub 'https://${DeliveryDistribution.DomainName}'

  DistributionId:
    Value: !Ref DeliveryDistribution
    Export:
      Name: !Sub '${AWS::StackName}-DistributionId'
