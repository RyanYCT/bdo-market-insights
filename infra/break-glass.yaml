AWSTemplateFormatVersion: '2010-09-09'
Description: >
  On-demand break-glass access to RDS: a t4g.nano instance + EC2 Instance
  Connect Endpoint for an IAM-authenticated SSH tunnel, as the RDS master user.
  NOT part of the root template (ADR-0027): deployed on demand via
  `make break-glass-up` and torn down with `make break-glass-down`, so there is
  no standing host. Routine DB access uses the admin-query Lambda (ADR-0026).

Parameters:
  Stage:
    Type: String
    AllowedValues:
      - dev
      - prod
  PrivateSubnetA:
    Type: AWS::EC2::Subnet::Id
  BreakGlassSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

Resources:
  # ──────────────────────────────────────────────
  # IAM Role & Instance Profile
  # ──────────────────────────────────────────────
  BreakGlassRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub 'bdo-${Stage}-break-glass-role'

  BreakGlassInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref BreakGlassRole

  # ──────────────────────────────────────────────
  # EC2 Instance
  # ──────────────────────────────────────────────
  BreakGlassInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t4g.nano
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}'
      SubnetId: !Ref PrivateSubnetA
      SecurityGroupIds:
        - !Ref BreakGlassSecurityGroupId
      IamInstanceProfile: !Ref BreakGlassInstanceProfile
      Tags:
        - Key: Name
          Value: !Sub 'bdo-${Stage}-break-glass'

  # ──────────────────────────────────────────────
  # EC2 Instance Connect Endpoint
  # ──────────────────────────────────────────────
  InstanceConnectEndpoint:
    Type: AWS::EC2::InstanceConnectEndpoint
    Properties:
      SubnetId: !Ref PrivateSubnetA
      SecurityGroupIds:
        - !Ref BreakGlassSecurityGroupId
      PreserveClientIp: false

Outputs:
  BreakGlassInstanceId:
    Value: !Ref BreakGlassInstance
    Export:
      Name: !Sub '${AWS::StackName}-BreakGlassInstanceId'

  InstanceConnectEndpointId:
    Value: !Ref InstanceConnectEndpoint
    Export:
      Name: !Sub '${AWS::StackName}-InstanceConnectEndpointId'
