AWSTemplateFormatVersion: '2010-09-09'
# AWS::LanguageExtensions is listed FIRST so its Fn::ForEach loops expand before
# the SAM macro runs (ADR-0036); the per-region daily and weekly EventBridge
# rules are generated below from the BdoRegions list.
Transform: [AWS::LanguageExtensions, AWS::Serverless-2016-10-31]
Description: >
  Insights pipeline for bdo-market-insights: daily digest computation,
  LLM narrative summarisation (Bedrock Converse), deterministic fallback,
  and upsert into market_summary. Step Functions state machine
  (ComputeDigest -> Summarize -> StoreSummary) with one daily and one weekly
  EventBridge schedule per active region (generated from BdoRegions).

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
  BdoRegions:
    Type: CommaDelimitedList
    Description: >
      Active BDO server regions (ADR-0036), passed from the root stack as a
      comma-joined string. One daily and one weekly insights schedule is
      generated per entry; element 0 is the primary region used only for the
      scalar BDO_REGION env default (per-execution region is carried in the
      schedule input).
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: SG for in-VPC Lambdas (egress to RDS)
  PrivateSubnetA:
    Type: AWS::EC2::Subnet::Id
    Description: Primary private subnet; in-VPC Lambdas run here only (ADR-0011)
  RdsEndpoint:
    Type: String
    Description: RDS Postgres endpoint address
  RdsPort:
    Type: String
    Description: RDS Postgres port
  LambdaRdsAuthRoleArn:
    Type: String
    Description: Execution role for in-VPC Lambdas (VPC + X-Ray + rds-db:connect)
  CommonLayerArn:
    Type: String
    Description: ARN of the shared bdo-common Lambda layer (from the platform stack, ADR-0032)
  BedrockModelId:
    Type: String
    Default: 'us.amazon.nova-lite-v1:0'
    Description: >
      Bedrock model/inference-profile ID used to invoke Converse. The default is
      a cross-region (CRIS) inference profile; see BedrockFoundationModelId.
  BedrockFoundationModelId:
    Type: String
    Default: 'amazon.nova-lite-v1:0'
    Description: >
      Underlying foundation-model ID that BedrockModelId routes to, used only to
      scope IAM. When BedrockModelId is a cross-region inference profile (e.g.
      us.amazon.nova-lite-v1:0), invoking it requires permission on both the
      inference-profile ARN and the foundation-model ARN. Keep in sync with
      BedrockModelId (strip the region prefix).
  InsightsAlarmEmail:
    Type: String
    Default: ''
    Description: Optional email subscribed to the insights SNS topic (blank = no subscription)
  LogRetentionInDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 180, 365, 400, 545, 731, 1827, 3653]
    Description: Retention for this stack's Lambda log groups (default 30, matches the API SLO window)

Conditions:
  HasInsightsEmail: !Not [!Equals [!Ref InsightsAlarmEmail, '']]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Tracing: Active
    Layers:
      - !Ref CommonLayerArn
    Environment:
      Variables:
        STAGE: !Ref Stage
        BDO_REGION: !Select [0, !Ref BdoRegions]
        POWERTOOLS_SERVICE_NAME: bdo-market-insights
        POWERTOOLS_METRICS_NAMESPACE: BdoMarket

Resources:
  # ──────────────────────────────────────────────
  # Insights functions — in VPC (RDS via IAM auth)
  # ──────────────────────────────────────────────
  InsightsComputeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bdo-${Stage}-insights-compute'
      CodeUri: ../src/functions/insights_compute
      Handler: app.handler
      Timeout: 60
      Role: !Ref LambdaRdsAuthRoleArn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds:
          - !Ref PrivateSubnetA
      Environment:
        Variables:
          DB_HOST: !Ref RdsEndpoint
          DB_PORT: !Ref RdsPort
          DB_NAME: bdo
          DB_USER: lambda_rds_user
          USE_IAM_AUTH: 'true'

  InsightsStoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bdo-${Stage}-insights-store'
      CodeUri: ../src/functions/insights_store
      Handler: app.handler
      Role: !Ref LambdaRdsAuthRoleArn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds:
          - !Ref PrivateSubnetA
      Environment:
        Variables:
          DB_HOST: !Ref RdsEndpoint
          DB_PORT: !Ref RdsPort
          DB_NAME: bdo
          DB_USER: lambda_rds_user
          USE_IAM_AUTH: 'true'

  # ──────────────────────────────────────────────
  # Summarize function — out of VPC (Bedrock)
  # ──────────────────────────────────────────────
  InsightsSummarizeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'bdo-${Stage}-insights-summarize-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: XRayWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'
        - PolicyName: BedrockConverse
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Invoking a cross-region inference profile requires permission on
              # BOTH the inference-profile ARN (account-scoped, in the source
              # region) AND the foundation-model ARN it routes to (service-owned,
              # region wildcard covers the profile's destination regions). A
              # foundation-model-only grant would be denied for a CRIS profile.
              - Effect: Allow
                Action:
                  - bedrock:Converse
                  - bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}'
                  - !Sub 'arn:aws:bedrock:*::foundation-model/${BedrockFoundationModelId}'

  InsightsSummarizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bdo-${Stage}-insights-summarize'
      CodeUri: ../src/functions/insights_summarize
      Handler: app.handler
      Timeout: 60
      Role: !GetAtt InsightsSummarizeRole.Arn
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId

  # ──────────────────────────────────────────────
  # SNS topic for insights notifications
  # ──────────────────────────────────────────────
  InsightsNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'bdo-${Stage}-insights'
      DisplayName: !Sub 'bdo-${Stage} insights notifications'

  InsightsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasInsightsEmail
    Properties:
      TopicArn: !Ref InsightsNotificationTopic
      Protocol: email
      Endpoint: !Ref InsightsAlarmEmail

  # ──────────────────────────────────────────────
  # Discord notifier — out of VPC, SNS-triggered
  # ──────────────────────────────────────────────
  InsightsDiscordRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'bdo-${Stage}-insights-discord-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: XRayWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'
        - PolicyName: SsmDiscordWebhook
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/bdo-market-insights/${Stage}/insights/discord-webhook'

  InsightsDiscordFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bdo-${Stage}-insights-discord'
      CodeUri: ../src/functions/insights_discord
      Handler: app.handler
      Timeout: 30
      Role: !GetAtt InsightsDiscordRole.Arn
      Events:
        InsightsSns:
          Type: SNS
          Properties:
            Topic: !Ref InsightsNotificationTopic

  # ──────────────────────────────────────────────
  # Step Functions state machine (daily insights)
  # ──────────────────────────────────────────────
  InsightsStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub 'bdo-${Stage}-insights'
      Type: STANDARD
      Tracing:
        Enabled: true
      DefinitionSubstitutions:
        InsightsComputeArn: !GetAtt InsightsComputeFunction.Arn
        InsightsSummarizeArn: !GetAtt InsightsSummarizeFunction.Arn
        InsightsStoreArn: !GetAtt InsightsStoreFunction.Arn
        InsightsTopicArn: !Ref InsightsNotificationTopic
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref InsightsComputeFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref InsightsSummarizeFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref InsightsStoreFunction
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt InsightsNotificationTopic.TopicName
      # No inline Schedule events: the per-region daily and weekly triggers are
      # generated from BdoRegions via Fn::ForEach below (ADR-0036), so the state
      # machine stays a single resource and the schedule set is declarative.
      Definition:
        Comment: BDO market insights (digest + narrative + store; daily & weekly)
        StartAt: ComputeDigest
        States:
          ComputeDigest:
            Type: Task
            Resource: '${InsightsComputeArn}'
            Retry:
              - ErrorEquals:
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2
            Next: Summarize
          Summarize:
            Type: Task
            Resource: '${InsightsSummarizeArn}'
            Retry:
              - ErrorEquals:
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2
            Catch:
              - ErrorEquals:
                  - States.ALL
                ResultPath: $.error
                Next: StoreSummary
            Next: StoreSummary
          StoreSummary:
            Type: Task
            Resource: '${InsightsStoreArn}'
            Retry:
              - ErrorEquals:
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2
            Next: PublishNotification
          PublishNotification:
            Type: Task
            Resource: 'arn:aws:states:::sns:publish'
            Parameters:
              TopicArn: '${InsightsTopicArn}'
              Message.$: >-
                States.JsonToString($)
            Retry:
              - ErrorEquals:
                  - States.TaskFailed
                  - States.Timeout
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2
            Catch:
              - ErrorEquals:
                  - States.ALL
                Next: NotificationSkipped
            End: true
          NotificationSkipped:
            Type: Succeed
            Comment: >-
              Best-effort notification failed after retries. The summary is
              already stored and served via /v1/insights, so the run still
              succeeds rather than reporting a false failure.

  # ──────────────────────────────────────────────
  # Per-region insights triggers (ADR-0036)
  # ──────────────────────────────────────────────
  # One daily and one weekly EventBridge rule per region in BdoRegions,
  # generated by two Fn::ForEach loops. Each rule starts an independent insights
  # execution carrying its own region and period. A single shared role scoped to
  # this stack's state-machine ARN backs every generated rule. As in etl.yaml,
  # &{RegionName} in each logical id strips non-alphanumerics (console_eu ->
  # consoleeu) while ${RegionName} in the name/input keeps the exact region.
  #
  # Unlike the hourly ETL (which simply re-fires next hour, ADR-0036), these are
  # low-cadence: a dropped StartExecution would otherwise wait a full day/week.
  # So the daily/weekly targets carry a DeadLetterConfig -- EventBridge retries,
  # then parks the failed invocation in this DLQ for inspection/redrive.
  InsightsScheduleDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'bdo-${Stage}-insights-schedule-dlq'
      MessageRetentionPeriod: 1209600  # 14 days

  InsightsScheduleDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref InsightsScheduleDlq
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgeDlqSend
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt InsightsScheduleDlq.Arn
            # Scope to this stack's generated insights rules only.
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/bdo-${Stage}-insights-*'

  InsightsScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'bdo-${Stage}-insights-schedule-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartInsightsExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref InsightsStateMachine

  'Fn::ForEach::InsightsDailySchedules':
    - RegionName
    - !Ref BdoRegions
    - 'InsightsDaily&{RegionName}':
        Type: AWS::Events::Rule
        Properties:
          Name: !Sub 'bdo-${Stage}-insights-daily-${RegionName}'
          ScheduleExpression: cron(0 1 * * ? *)
          State: ENABLED
          Description: !Sub 'Daily market insights for ${RegionName} (~01:00 UTC)'
          Targets:
            - Id: !Sub 'insights-daily-${RegionName}'
              Arn: !Ref InsightsStateMachine
              RoleArn: !GetAtt InsightsScheduleRole.Arn
              Input: !Sub '{"region": "${RegionName}", "period": "daily"}'
              DeadLetterConfig:
                Arn: !GetAtt InsightsScheduleDlq.Arn

  'Fn::ForEach::InsightsWeeklySchedules':
    - RegionName
    - !Ref BdoRegions
    - 'InsightsWeekly&{RegionName}':
        Type: AWS::Events::Rule
        Properties:
          Name: !Sub 'bdo-${Stage}-insights-weekly-${RegionName}'
          ScheduleExpression: cron(15 1 ? * MON *)
          State: ENABLED
          Description: !Sub 'Weekly market insights for ${RegionName} (Monday ~01:15 UTC)'
          Targets:
            - Id: !Sub 'insights-weekly-${RegionName}'
              Arn: !Ref InsightsStateMachine
              RoleArn: !GetAtt InsightsScheduleRole.Arn
              Input: !Sub '{"region": "${RegionName}", "period": "weekly"}'
              DeadLetterConfig:
                Arn: !GetAtt InsightsScheduleDlq.Arn

  # ──────────────────────────────────────────────
  # Log groups — co-located with their functions (ADR-0030).
  # ──────────────────────────────────────────────
  InsightsComputeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/bdo-${Stage}-insights-compute'
      RetentionInDays: !Ref LogRetentionInDays

  InsightsSummarizeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/bdo-${Stage}-insights-summarize'
      RetentionInDays: !Ref LogRetentionInDays

  InsightsStoreLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/bdo-${Stage}-insights-store'
      RetentionInDays: !Ref LogRetentionInDays

  InsightsDiscordLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/bdo-${Stage}-insights-discord'
      RetentionInDays: !Ref LogRetentionInDays

Outputs:
  InsightsStateMachineArn:
    Value: !Ref InsightsStateMachine
    Export:
      Name: !Sub '${AWS::StackName}-InsightsStateMachineArn'

  InsightsNotificationTopicArn:
    Value: !Ref InsightsNotificationTopic
    Export:
      Name: !Sub '${AWS::StackName}-InsightsNotificationTopicArn'
